name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guardrail suite (39 cases)
        run: python service/test_guardrail.py
      - name: Pipeline smoke (mock brain)
        run: python tests/smoke.py
